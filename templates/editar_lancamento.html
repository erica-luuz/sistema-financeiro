{% extends "base.html" %}

{% block titulo %}Editar lançamento{% endblock %}

{% block conteudo %}
    <h1>Editar lançamento</h1>

    {% if erro %}
    <p style="color: red;">{{ erro }}</p>
    {% endif %}

    <form method="post">
        <p>
            <label for="descricao">Descrição</label><br>
            <input type="text" id="descricao" name="descricao" value="{{ lancamento['descricao'] }}" required>
        </p>

        <p>
            <label for="valor">Valor (R$)</label><br>
            <input type="number" id="valor" name="valor" step="0.01" min="0.01"
                   value="{{ '%.2f' | format(lancamento['valor_centavos'] / 100) }}" required>
        </p>

        <p>
            <label for="tipo">Tipo</label><br>
            <select id="tipo" name="tipo" required>
                <option value="despesa" {% if lancamento['tipo'] == 'despesa' %}selected{% endif %}>Despesa</option>
                <option value="receita" {% if lancamento['tipo'] == 'receita' %}selected{% endif %}>Receita</option>
            </select>
        </p>

        <p>
            <label for="data">Data</label><br>
            <input type="date" id="data" name="data" value="{{ lancamento['data'] }}" required>
        </p>

        <p>
            <label for="categoria_id">Categoria</label><br>
            <select id="categoria_id" name="categoria_id" required>
                {% for categoria in categorias %}
                <option value="{{ categoria['id'] }}"
                        {% if categoria['id'] == lancamento['categoria_id'] %}selected{% endif %}>
                    {{ categoria['nome'] }} ({{ categoria['tipo'] }})
                </option>
                {% endfor %}
            </select>
        </p>

        <p>
            <label for="observacao">Observação</label><br>
            <textarea id="observacao" name="observacao">{{ lancamento['observacao'] or '' }}</textarea>
        </p>

        <button type="submit">Salvar alterações</button>
        <a href="{{ url_for('lancamentos') }}">Cancelar</a>
    </form>
{% endblock %}
