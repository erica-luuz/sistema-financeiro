{% extends "base.html" %}

{% block titulo %}Nova categoria{% endblock %}

{% block conteudo %}
    <div class="cabecalho-pagina">
        <h1>Nova categoria</h1>
    </div>

    {% if erro %}
    <p class="alerta">{{ erro }}</p>
    {% endif %}

    <form method="post" class="painel formulario">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="campo">
            <label for="nome">Nome</label>
            <input type="text" id="nome" name="nome" value="{{ nome or '' }}" required>
        </div>

        <div class="campo">
            <label for="tipo">Tipo</label>
            <select id="tipo" name="tipo" required>
                <option value="despesa" {% if tipo == 'despesa' %}selected{% endif %}>Despesa</option>
                <option value="receita" {% if tipo == 'receita' %}selected{% endif %}>Receita</option>
            </select>
        </div>

        <div class="botoes-form">
            <button type="submit" class="botao botao-primario">Criar categoria</button>
            <a href="{{ url_for('categorias') }}">Cancelar</a>
        </div>
    </form>
{% endblock %}
