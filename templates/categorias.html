{% extends "base.html" %}

{% block titulo %}Categorias{% endblock %}

{% block conteudo %}
<h1>Categorias</h1>

    <table>
        <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Tipo</th>
        </tr>
        {% for categoria in categorias %}
        <tr>
            <td>{{ categoria["id"] }}</td>
            <td>{{ categoria["nome"] }}</td>
            <td>{{ categoria["tipo"] }}</td>
        </tr>
        {% endfor %}
    </table>

{% endblock %}
