{% extends "base.html" %}

{% block titulo %}Entrar{% endblock %}

{% block conteudo %}
    <div class="caixa-login">
        <h1>Entrar</h1>
        <p class="subtitulo">Finanças da Casa</p>

        {% if erro %}
        <p class="alerta">{{ erro }}</p>
        {% endif %}

        <form method="post" class="painel">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="hidden" name="proximo" value="{{ proximo }}">

            <div class="campo">
                <label for="login">Login</label>
                <input type="text" id="login" name="login" value="{{ login or '' }}"
                       autocomplete="username" autocapitalize="none" autofocus required>
            </div>

            <div class="campo">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" autocomplete="current-password" required>
            </div>

            <div class="campo campo-checkbox">
                <input type="checkbox" id="manter_conectado" name="manter_conectado" value="1">
                <label for="manter_conectado">Manter conectado por 30 dias (só em aparelhos de vocês)</label>
            </div>

            <button type="submit" class="botao botao-primario botao-largo">Entrar</button>
        </form>
    </div>
{% endblock %}
